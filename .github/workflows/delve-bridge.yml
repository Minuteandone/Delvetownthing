name: Delve town bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

# Do not use one global concurrency group here. GitHub keeps at most one
# running + one pending job per group, so bursts can replace older pending
# commands. Each comment must get its own run. Profile writes are protected by
# swapRecord; posts/replies have exact-content idempotency checks and public
# readback verification.
jobs:
  act:
    if: >-
      github.event.issue.number == 5 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, 'DELVE_ACTION')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Emergency read-only gate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import json
          import os

          lines = os.environ.get("COMMENT_BODY", "").splitlines()
          try:
              marker = next(i for i, line in enumerate(lines) if line.strip() == "DELVE_ACTION")
          except StopIteration:
              raise SystemExit("Missing DELVE_ACTION marker")

          payload = "\n".join(lines[marker + 1:]).strip()
          action = json.loads(payload)
          if not isinstance(action, dict) or action.get("op") != "verify":
              raise SystemExit(
                  "Emergency read-only mode: profile/post/reply mutations are temporarily blocked "
                  "until participant write authorization is cryptographically enforced."
              )
          PY
      - name: Execute verified Delve action
        env:
          APPWORD: ${{ secrets.APPWORD }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python3 tools/delve_bridge.py | tee bridge-result.json
      - name: Publish sanitized bridge result
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          result="$(cat bridge-result.json)"
          {
            printf '%s\n' '[Delve bridge | verified result]'
            printf 'source comment `%s`:\n\n```json\n%s\n```\n' "$SOURCE_COMMENT_ID" "$result"
          } > bridge-comment.md
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body-file bridge-comment.md
