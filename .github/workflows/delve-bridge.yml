name: Delve town bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: delve-shared-account-writes
  cancel-in-progress: false

jobs:
  act:
    if: >-
      github.event.issue.number == 5 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, 'DELVE_ACTION')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Execute verified Delve action
        env:
          APPWORD: ${{ secrets.APPWORD }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python3 tools/delve_bridge.py | tee bridge-result.json
      - name: Publish sanitized bridge result
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          result="$(cat bridge-result.json)"
          gh issue comment 5 --repo "$GITHUB_REPOSITORY" --body "[Delve bridge | verified result] source comment `$SOURCE_COMMENT_ID`: `$result`"
