name: Delve public record lookup

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  lookup:
    if: github.event.issue.number == 5
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve matching public ATProto records
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          def get_json(url):
              req = urllib.request.Request(url, headers={"Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.load(resp)

          lines = os.environ.get("COMMENT_BODY", "").splitlines()
          if not lines or lines[0].strip() != "DELVE_PUBLIC_LOOKUP":
              print('{"skipped":true,"reason":"not a DELVE_PUBLIC_LOOKUP command"}')
              raise SystemExit(0)

          payload = json.loads("\n".join(lines[1:]).strip())
          repo = payload.get("repo")
          handle = payload.get("handle")
          collection = payload.get("collection", "town.delve.feed.post")
          limit = int(payload.get("limit", 50))
          if limit < 1 or limit > 100:
              raise SystemExit("limit must be 1..100")

          raw_terms = payload.get("containsAny")
          if raw_terms is not None:
              if not isinstance(raw_terms, list) or not raw_terms or len(raw_terms) > 100:
                  raise SystemExit("containsAny must be a non-empty array of <=100 strings")
              terms = [str(term) for term in raw_terms if str(term)]
          else:
              terms = [str(payload.get("contains", ""))]

          folded_terms = [(term, term.casefold()) for term in terms]

          if repo is None:
              if not isinstance(handle, str) or not handle.endswith(".delve.town"):
                  raise SystemExit("provide a Delve handle or did:plc repo")
              params = urllib.parse.urlencode({"handle": handle.lower().lstrip("@")})
              resolved = get_json(
                  "https://pds.delve.town/xrpc/com.atproto.identity.resolveHandle?" + params
              )
              repo = resolved.get("did")

          if not (isinstance(repo, str) and repo.startswith("did:plc:")):
              raise SystemExit("resolved repo must be a did:plc identifier")
          if collection != "town.delve.feed.post":
              raise SystemExit("only public Delve post lookup is allowed")

          did_url = "https://plc.directory/" + urllib.parse.quote(repo, safe=":")
          did_doc = get_json(did_url)

          pds = None
          for service in did_doc.get("service", []):
              if not isinstance(service, dict):
                  continue
              if service.get("type") == "AtprotoPersonalDataServer" or str(service.get("id","")).endswith("#atproto_pds"):
                  endpoint = service.get("serviceEndpoint")
                  if isinstance(endpoint, str):
                      pds = endpoint.rstrip("/")
                      break
          if not pds or not pds.startswith("https://"):
              raise SystemExit("DID document has no HTTPS atproto PDS")

          params = urllib.parse.urlencode({
              "repo": repo,
              "collection": collection,
              "limit": limit,
              "reverse": "true",
          })
          data = get_json(pds + "/xrpc/com.atproto.repo.listRecords?" + params)

          hits = []
          for row in data.get("records", []):
              value = row.get("value") or {}
              text = value.get("text") or ""
              folded = text.casefold()
              matched = [original for original, needle in folded_terms if needle in folded]
              if matched:
                  reply = value.get("reply") or {}
                  hits.append({
                      "uri": row.get("uri"),
                      "text": text[:700],
                      "createdAt": value.get("createdAt"),
                      "parent": (reply.get("parent") or {}).get("uri"),
                      "root": (reply.get("root") or {}).get("uri"),
                      "matchedTerms": matched,
                  })

          print(json.dumps({
              "handle": handle,
              "repo": repo,
              "pds": pds,
              "terms": terms,
              "matches": hits
          }, ensure_ascii=False))
          PY
