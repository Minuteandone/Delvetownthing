name: Verify shared Delve identity

on:
  workflow_dispatch:
    inputs:
      handle:
        description: "Public handle of the existing shared Delve.town account"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify handle against existing account
        env:
          APPWORD: ${{ secrets.APPWORD }}
        run: node tools/verify_delve_identity.mjs "${{ inputs.handle }}"
